<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash Bandicoot</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <!-- Load the EmulatorJS library -->
    <script src="https://jsdelivr.net"></script>

    <script>
        EJS_player = "#game";
        
        // 1. Set the core specifically to 'psx'
        EJS_core = "psx";
        
        // 2. Path to your PS1 game ROM (.cue, .chd, or .bin)
        EJS_gameUrl = "https://www.dropbox.com/scl/fi/vf6ebxk2byu0chh2xv7a5/Crash-Bandicoot.bin?rlkey=18z8frolx43zfa4ybk9sydocy&st=aoh3y07u&dl=0"; 

        // 3. PS1 mandatory requirement: Path to your PSX BIOS file
        EJS_biosUrl = "https://github.com/snuffsnufkin/mini_mario/blob/main/scph5501.bin"; 

        // Path to the central EmulatorJS data folder
        EJS_pathtodata = "https://jsdelivr.net";
    </script>

</body>
</html>
